name: Production Release

# Releases are deliberate. Pushing a matching `v*` tag builds every supported
# installer: macOS Apple Silicon, macOS Intel, Windows x64, and Linux x64.
# `workflow_dispatch` is retained only to rebuild a platform group for an
# existing release; it never invents a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Installer group to build"
        required: true
        default: other
        type: choice
        options:
          - macos
          - other

permissions:
  contents: write

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        name: Take the version from the tag that triggered this run
        shell: bash
        run: |
          # The tag is the decision. Nothing here invents one.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version, got: $tag" >&2
            exit 1
          fi
          manifest="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$manifest" ]]; then
            echo "Tag $tag does not match package.json ($manifest). Bump the version first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_macos:
    needs: version
    if: needs.version.outputs.tag != '' && (github.event_name == 'push' || github.event.inputs.targets == 'macos')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Runner ARM macos-latest treo ngắt quãng trong Tauri mà không flush log.
          # Runner Intel có cross linker của Xcode; Rust và Node bên dưới vẫn chọn
          # đúng target ARM64 nên installer tạo ra vẫn dành cho Apple Silicon.
          - platform: macos-15-intel
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            dmg_arch: "aarch64"
            asset_suffix: "macOS-Apple-Silicon"
          # The runner is pure JavaScript (SQLite comes from `node:sqlite`), so
          # this runner only has to produce the Intel Tauri binary — there is no
          # native Node addon left to compile per architecture.
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            dmg_arch: "x64"
            asset_suffix: "macOS-Intel"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Set installer version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install AI Router runtime dependencies
        run: npm ci --prefix ai-router

      - name: Build bundled Agent Runner runtime
        run: |
          npm ci --prefix agent-runner
          ./agent-runner/node_modules/.bin/tsc --project agent-runner/tsconfig.json

      - name: Bundle Node runtime for AI Router
        shell: bash
        run: |
          # Only the Node binary differs per platform now; the runner's own
          # JavaScript is identical everywhere.
          case "${{ matrix.args }}" in
            *aarch64-apple-darwin*)  archive="node-v24.18.0-darwin-arm64" ;;
            *x86_64-apple-darwin*)   archive="node-v24.18.0-darwin-x64" ;;
            *aarch64-unknown-linux*) archive="node-v24.18.0-linux-arm64" ;;
            *x86_64-unknown-linux*)  archive="node-v24.18.0-linux-x64" ;;
            *)
              case "$(uname -s)" in
                Darwin) archive="node-v24.18.0-darwin-$(uname -m | sed 's/arm64/arm64/;s/x86_64/x64/')" ;;
                Linux)  archive="node-v24.18.0-linux-$(uname -m | sed 's/aarch64/arm64/;s/x86_64/x64/')" ;;
                *) echo "Unsupported target: ${{ matrix.args }}" >&2; exit 1 ;;
              esac
              ;;
          esac
          curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.tar.gz" -o /tmp/node.tar.gz
          mkdir -p runtime/node
          tar -xzf /tmp/node.tar.gz -C /tmp
          install -m 755 "/tmp/${archive}/bin/node" runtime/node/node

      - name: Verify bundled runtime input
        run: |
          test -x runtime/node/node
          test -f ai-router/src/sidecar.mjs
          test -f ai-router/node_modules/undici/package.json
          test -f ai-router/node_modules/uuid/package.json
          test -f ai-router/node_modules/node-machine-id/package.json
          test -f agent-runner/dist/index.js
          # The runner must stay free of native addons: SQLite comes from
          # `node:sqlite`, so the same dist/ runs on every platform and there is
          # no per-architecture .node file to verify.
          ! grep -rqE "from [\"']better-sqlite3|require\([\"']better-sqlite3" agent-runner/dist
          test ! -d agent-runner/node_modules/better-sqlite3

      - name: Build signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Verify packaged AI Router runtime
        shell: bash
        run: |
          app_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name 'V Assistant.app' -type d -print -quit)"
          test -n "$app_path"
          test -f "$app_path/Contents/Resources/_up_/ai-router/src/sidecar.mjs"
          test -f "$app_path/Contents/Resources/_up_/ai-router/node_modules/undici/package.json"
          test -f "$app_path/Contents/Resources/_up_/ai-router/node_modules/uuid/package.json"
          test -f "$app_path/Contents/Resources/_up_/ai-router/node_modules/node-machine-id/package.json"
          test -x "$app_path/Contents/Resources/_up_/runtime/node/node"
          test -f "$app_path/Contents/Resources/_up_/agent-runner/dist/index.js"
          ! grep -rqE "from [\"']better-sqlite3|require\([\"']better-sqlite3" "$app_path/Contents/Resources/_up_/agent-runner/dist"

      - name: Verify updater artifacts
        shell: bash
        run: |
          updater="$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.tar.gz' -print -quit)"
          test -n "$updater"
          test -f "$updater.sig"

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          retry() {
            local attempt=0 status=0
            until "$@"; do
              status=$?
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then return "$status"; fi
              sleep $((attempt * 10))
            done
          }
          if ! retry gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            retry gh release create "$TAG" --repo "${{ github.repository }}" \
              --draft --title "V Assistant $TAG" \
              --notes "Download the installer for your platform below, then open it to install V Assistant." || \
              retry gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          mkdir -p .release-assets
          while IFS= read -r -d '' signature; do
            artifact="${signature%.sig}"
            name="$(basename "$artifact")_${{ matrix.asset_suffix }}"
            cp "$artifact" ".release-assets/$name"
            cp "$signature" ".release-assets/$name.sig"
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.sig' -print0)
          retry gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/V Assistant_${{ needs.version.outputs.version }}_${{ matrix.dmg_arch }}.dmg" \
            .release-assets/*


  build_other:
    # tauri-action creates/uploads one draft release. Start this matrix only
    # after both macOS entries have finished writing their release assets.
    needs: [version, build_macos]
    if: >-
      always() && needs.version.outputs.tag != '' &&
      ((github.event_name == 'push' && needs.build_macos.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.targets == 'other'))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            asset_suffix: Linux-x86_64
          - platform: windows-latest
            asset_suffix: Windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Set installer version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install AI Router runtime dependencies
        run: npm ci --prefix ai-router

      - name: Build bundled Agent Runner runtime
        run: |
          npm ci --prefix agent-runner
          ./agent-runner/node_modules/.bin/tsc --project agent-runner/tsconfig.json

      - name: Bundle Node runtime for AI Router
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            archive="node-v24.18.0-win-x64"
            curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.zip" -o node.zip
            unzip -q node.zip
            install -m 755 "${archive}/node.exe" runtime/node/node.exe
          else
            archive="node-v24.18.0-linux-x64"
            curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.tar.gz" -o node.tar.gz
            tar -xzf node.tar.gz
            install -m 755 "${archive}/bin/node" runtime/node/node
          fi

      - name: Verify bundled runtime input
        shell: bash
        run: |
          test -f ai-router/src/sidecar.mjs
          test -f ai-router/node_modules/undici/package.json
          test -f ai-router/node_modules/uuid/package.json
          test -f ai-router/node_modules/node-machine-id/package.json
          test -f agent-runner/dist/index.js
          ! grep -rqE "from [\"']better-sqlite3|require\([\"']better-sqlite3" agent-runner/dist
          test ! -d agent-runner/node_modules/better-sqlite3
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            test -f runtime/node/node.exe
          else
            test -x runtime/node/node
          fi

      - name: Build signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Verify Windows installer (Smoke Test)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          $nsisInstaller = "src-tauri/target/release/bundle/nsis/V Assistant_${{ needs.version.outputs.version }}_x64-setup.exe"
          # Get absolute path for MSI to avoid 1619 error in msiexec
          $msiInstaller = Resolve-Path "src-tauri/target/release/bundle/msi/V Assistant_${{ needs.version.outputs.version }}_x64_en-US.msi"
          $nsisInstallPath = "$env:LOCALAPPDATA\Programs\V Assistant\v-assistant.exe"
          $msiInstallPath = "C:\Program Files\V Assistant\v-assistant.exe"

          # Helper to wait for file
          function Wait-For-File($path, $seconds) {
            for ($i = 1; $i -le $seconds; $i++) {
              if (Test-Path $path) { return $true }
              Start-Sleep -Seconds 1
            }
            return $false
          }

          Write-Host "Attempting silent installation via NSIS..."
          # Pass /D without quotes as NSIS requires, using Start-Process
          $process = Start-Process -FilePath $nsisInstaller -ArgumentList "/S", "/D=$env:LOCALAPPDATA\Programs\V Assistant" -Wait -PassThru -NoNewWindow
          Write-Host "NSIS Installer ExitCode: $($process.ExitCode)"

          if (Wait-For-File $nsisInstallPath 15) {
            Write-Host "Verification Success: V Assistant installed successfully via NSIS!"
            exit 0
          }

          Write-Host "NSIS silent install did not produce file. Trying MSI installer..."
          $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "`"$msiInstaller`"", "/qn", "/norestart", "/log", "msi_install.log" -Wait -PassThru
          Write-Host "MSI Installer ExitCode: $($msiProcess.ExitCode)"

          if (Wait-For-File $msiInstallPath 15) {
            Write-Host "Verification Success: V Assistant installed successfully via MSI!"
            exit 0
          }

          if (Test-Path "msi_install.log") {
            Write-Host "MSI Install Log Content:"
            Get-Content "msi_install.log" -Tail 50
          }

          Write-Host "Searching for v-assistant.exe under User Profile..."
          $foundFiles = Get-ChildItem -Path $env:USERPROFILE -Filter "v-assistant.exe" -Recurse -ErrorAction SilentlyContinue
          if ($foundFiles) {
            Write-Host "Found v-assistant.exe at: $($foundFiles[0].FullName)"
            exit 0
          }

          Write-Error "Verification Failed: Neither NSIS nor MSI installer produced v-assistant.exe."
          exit 1

      - name: Upload platform artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          retry() {
            local attempt=0 status=0
            until "$@"; do
              status=$?
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 5 ]; then return "$status"; fi
              sleep $((attempt * 10))
            done
          }
          if ! retry gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            retry gh release create "$TAG" --repo "${{ github.repository }}" \
              --draft --title "V Assistant $TAG" \
              --notes "Download the installer for your platform below, then open it to install V Assistant." || \
              retry gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          mkdir -p .release-assets
          while IFS= read -r -d '' signature; do
            artifact="${signature%.sig}"
            name="$(basename "$artifact")_${{ matrix.asset_suffix }}"
            cp "$artifact" ".release-assets/$name"
            cp "$signature" ".release-assets/$name.sig"
          done < <(find src-tauri/target/release/bundle -type f -name '*.sig' -print0)
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            retry gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
              "src-tauri/target/release/bundle/msi/V Assistant_${{ needs.version.outputs.version }}_x64_en-US.msi" \
              "src-tauri/target/release/bundle/nsis/V Assistant_${{ needs.version.outputs.version }}_x64-setup.exe"
          else
            retry gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
              "src-tauri/target/release/bundle/deb/V Assistant_${{ needs.version.outputs.version }}_amd64.deb" \
              "src-tauri/target/release/bundle/rpm/V Assistant-${{ needs.version.outputs.version }}-1.x86_64.rpm" \
              "src-tauri/target/release/bundle/appimage/V Assistant_${{ needs.version.outputs.version }}_amd64.AppImage"
          fi
          retry gh release upload "$TAG" --repo "${{ github.repository }}" --clobber .release-assets/*

  publish_release:
    needs: [version, build_macos, build_other]
    if: needs.version.outputs.tag != '' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node <<'EOF'
          const { execFileSync } = require("node:child_process");
          const { mkdirSync, readFileSync, writeFileSync } = require("node:fs");

          const release = JSON.parse(execFileSync("gh", ["release", "view", process.env.TAG, "--repo", process.env.REPO, "--json", "assets,body"], { encoding: "utf8" }));
          const assets = new Map(release.assets.map((asset) => [asset.name, asset]));
          const pick = (token) => {
            const signature = release.assets.find((asset) => asset.name.endsWith(".sig") && asset.name.includes(token) && assets.has(asset.name.slice(0, -4)));
            if (!signature) throw new Error(`Missing signed updater asset for: ${token}`);
            return { artifact: assets.get(signature.name.slice(0, -4)), signature };
          };
          const targets = {
            "darwin-aarch64": pick("macOS-Apple-Silicon"),
            "darwin-x86_64": pick("macOS-Intel"),
            "linux-x86_64": pick("Linux-x86_64"),
            "windows-x86_64": pick("Windows-x86_64"),
          };
          mkdirSync(".updater-signatures", { recursive: true });
          const platforms = {};
          for (const [target, { artifact, signature }] of Object.entries(targets)) {
            execFileSync("gh", ["release", "download", process.env.TAG, "--repo", process.env.REPO, "--pattern", signature.name, "--dir", ".updater-signatures"], { stdio: "inherit" });
            platforms[target] = {
              signature: readFileSync(`.updater-signatures/${signature.name}`, "utf8"),
              url: artifact.apiUrl || artifact.browserDownloadUrl || artifact.url,
            };
          }
          writeFileSync("latest.json", `${JSON.stringify({ version: process.env.VERSION, notes: release.body || "", pub_date: new Date().toISOString(), platforms }, null, 2)}\n`);
          EOF

      - name: Publish the completed cross-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber latest.json
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  publish_other:
    needs: [version, build_other]
    if: needs.version.outputs.tag != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.targets == 'other'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the completed cross-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
