name: Production Release

# Main commits build macOS installers first. Windows and Linux are built only
# after manual approval through workflow_dispatch. Docker is not part of this path.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: "Installer group to build"
        required: true
        default: other
        type: choice
        options:
          - macos
          - other

permissions:
  contents: write

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        name: Tag the next patch release for this main commit
        shell: bash
        run: |
          git fetch --tags --force
          latest_tag="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            version="$(node -p "require('./package.json').version")"
          else
            base_version="${latest_tag#v}"
            if [[ ! "$base_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag is not a semantic version: $latest_tag" >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

  build_macos:
    needs: version
    if: needs.version.outputs.tag != '' && (github.event_name == 'push' || github.event.inputs.targets == 'macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Set installer version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: V Assistant ${{ needs.version.outputs.tag }}
          releaseBody: Download the installer for your platform below, then open it to install V Assistant.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build_other:
    needs: version
    if: needs.version.outputs.tag != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.targets == 'other'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Set installer version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Build remaining installers and update draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: V Assistant ${{ needs.version.outputs.tag }}
          releaseBody: Download the installer for your platform below, then open it to install V Assistant.
          releaseDraft: true
          prerelease: false
