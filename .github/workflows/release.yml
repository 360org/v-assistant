name: Production Release

# Releases are deliberate. Pushing a matching `v*` tag builds every supported
# installer: macOS Apple Silicon, macOS Intel, Windows x64, and Linux x64.
# `workflow_dispatch` is retained only to rebuild a platform group for an
# existing release; it never invents a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Installer group to build"
        required: true
        default: other
        type: choice
        options:
          - macos
          - other

permissions:
  contents: write

concurrency:
  group: production-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: release
        name: Take the version from the tag that triggered this run
        shell: bash
        run: |
          # The tag is the decision. Nothing here invents one.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version, got: $tag" >&2
            exit 1
          fi
          manifest="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$manifest" ]]; then
            echo "Tag $tag does not match package.json ($manifest). Bump the version first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_macos:
    needs: version
    if: needs.version.outputs.tag != '' && (github.event_name == 'push' || github.event.inputs.targets == 'macos')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            asset_suffix: "macOS-Apple-Silicon"
          # The runner is pure JavaScript (SQLite comes from `node:sqlite`), so
          # this runner only has to produce the Intel Tauri binary — there is no
          # native Node addon left to compile per architecture.
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            asset_suffix: "macOS-Intel"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Set installer version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install AI Router runtime dependencies
        run: npm ci --prefix ai-router

      - name: Build bundled Agent Runner runtime
        run: |
          npm ci --prefix agent-runner
          ./agent-runner/node_modules/.bin/tsc --project agent-runner/tsconfig.json

      - name: Bundle Node runtime for AI Router
        shell: bash
        run: |
          # Only the Node binary differs per platform now; the runner's own
          # JavaScript is identical everywhere.
          case "${{ matrix.args }}" in
            *aarch64-apple-darwin*)  archive="node-v24.18.0-darwin-arm64" ;;
            *x86_64-apple-darwin*)   archive="node-v24.18.0-darwin-x64" ;;
            *aarch64-unknown-linux*) archive="node-v24.18.0-linux-arm64" ;;
            *x86_64-unknown-linux*)  archive="node-v24.18.0-linux-x64" ;;
            *)
              case "$(uname -s)" in
                Darwin) archive="node-v24.18.0-darwin-$(uname -m | sed 's/arm64/arm64/;s/x86_64/x64/')" ;;
                Linux)  archive="node-v24.18.0-linux-$(uname -m | sed 's/aarch64/arm64/;s/x86_64/x64/')" ;;
                *) echo "Unsupported target: ${{ matrix.args }}" >&2; exit 1 ;;
              esac
              ;;
          esac
          curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.tar.gz" -o /tmp/node.tar.gz
          mkdir -p runtime/node
          tar -xzf /tmp/node.tar.gz -C /tmp
          install -m 755 "/tmp/${archive}/bin/node" runtime/node/node

      - name: Verify bundled runtime input
        run: |
          test -x runtime/node/node
          test -f ai-router/src/sidecar.mjs
          test -f ai-router/node_modules/undici/package.json
          test -f ai-router/node_modules/uuid/package.json
          test -f ai-router/node_modules/node-machine-id/package.json
          test -f agent-runner/dist/index.js
          # The runner must stay free of native addons: SQLite comes from
          # `node:sqlite`, so the same dist/ runs on every platform and there is
          # no per-architecture .node file to verify.
          ! grep -rq "better-sqlite3" agent-runner/dist
          test ! -d agent-runner/node_modules/better-sqlite3

      # tauri-action picks its package manager from the lockfile. This repo has
      # pnpm-lock.yaml, so it runs `pnpm tauri build` — which failed instantly
      # on a runner that only had npm, with no compiler output to explain it.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Build installers and upload to draft release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: V Assistant ${{ needs.version.outputs.tag }}
          releaseBody: Download the installer for your platform below, then open it to install V Assistant.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseAssetNamePattern: "[name]_[version]_${{ matrix.asset_suffix }}[ext]"
          uploadUpdaterSignatures: true

      - name: Verify packaged AI Router runtime
        shell: bash
        run: |
          app_path="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name 'V Assistant.app' -type d -print -quit)"
          test -n "$app_path"
          test -f "$app_path/Contents/Resources/_up_/ai-router/src/sidecar.mjs"
          test -f "$app_path/Contents/Resources/_up_/ai-router/node_modules/undici/package.json"
          test -f "$app_path/Contents/Resources/_up_/ai-router/node_modules/uuid/package.json"
          test -f "$app_path/Contents/Resources/_up_/ai-router/node_modules/node-machine-id/package.json"
          test -x "$app_path/Contents/Resources/_up_/runtime/node/node"
          test -f "$app_path/Contents/Resources/_up_/agent-runner/dist/index.js"
          ! grep -rq "better-sqlite3" "$app_path/Contents/Resources/_up_/agent-runner/dist"

      - name: Verify updater artifacts
        shell: bash
        run: |
          updater="$(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f -name '*.tar.gz' -print -quit)"
          test -n "$updater"
          test -f "$updater.sig"


  build_other:
    needs: version
    if: needs.version.outputs.tag != '' && (github.event_name == 'push' || github.event.inputs.targets == 'other')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset_suffix: Linux-x86_64
          - platform: windows-latest
            asset_suffix: Windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Set installer version
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-release-version.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Install AI Router runtime dependencies
        run: npm ci --prefix ai-router

      - name: Build bundled Agent Runner runtime
        run: |
          npm ci --prefix agent-runner
          ./agent-runner/node_modules/.bin/tsc --project agent-runner/tsconfig.json

      - name: Bundle Node runtime for AI Router
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            ubuntu-22.04) archive="node-v24.18.0-linux-x64" ;;
            windows-latest) archive="node-v24.18.0-win-x64" ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.tar.gz" -o node.tar.gz
          mkdir -p runtime/node
          tar -xzf node.tar.gz
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            install -m 755 "${archive}/node.exe" runtime/node/node.exe
          else
            install -m 755 "${archive}/bin/node" runtime/node/node
          fi

      - name: Verify bundled runtime input
        shell: bash
        run: |
          test -f ai-router/src/sidecar.mjs
          test -f ai-router/node_modules/undici/package.json
          test -f ai-router/node_modules/uuid/package.json
          test -f ai-router/node_modules/node-machine-id/package.json
          test -f agent-runner/dist/index.js
          ! grep -rq "better-sqlite3" agent-runner/dist
          test ! -d agent-runner/node_modules/better-sqlite3
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            test -f runtime/node/node.exe
          else
            test -x runtime/node/node
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Build remaining installers and upload to draft release
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: V Assistant ${{ needs.version.outputs.tag }}
          releaseBody: Download the installer for your platform below, then open it to install V Assistant.
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: "[name]_[version]_${{ matrix.asset_suffix }}[ext]"
          uploadUpdaterSignatures: true

  publish_release:
    needs: [version, build_macos, build_other]
    if: needs.version.outputs.tag != '' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Publish the completed cross-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  publish_other:
    needs: [version, build_other]
    if: needs.version.outputs.tag != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.targets == 'other'
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the completed cross-platform release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
