name: CI

# Fast checks on every push / PR: skills validation, frontend type-check +
# build, and a Rust compile check of the desktop shell.
on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix agent-runner
      - name: Stage bundled Node runtime
        shell: bash
        run: |
          archive="node-v24.18.0-linux-x64"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.tar.gz" -o node.tar.gz
          tar -xzf node.tar.gz
          mkdir -p runtime/node
          install -m 755 "${archive}/bin/node" runtime/node/node
          test -x runtime/node/node
      # Runs validate-skills, tsc and vite build.
      - run: npm run build
      # Agent tool-calling loop: Vault lookup → HTTP action → reply, in-app.
      - run: node scripts/tool-loop-check.mjs
      # Telegram 2-way channel: inbound message → assistant → reply, in-app.
      - run: npx tsx agent-runner/scripts/telegram-check.mjs
      # Scheduler coverage runs with the Agent Runner job, where its SQLite IPC
      # fixtures and nested dependencies are installed.
      # Direct sign-in: code→key exchange, per-vendor routing, user creation.
      - run: node scripts/login-check.mjs
      # Đăng nhập xong là kết nối đã đăng ký, không bắt thêm provider lần nữa (#18).
      - run: node scripts/onboarding-connection-check.mjs
      # Đăng nhập lần đầu tạo tài khoản local user ở mọi lối đăng nhập.
      - run: node scripts/local-user-check.mjs
      # Role isolation: each role's prompt carries only its own memory/knowledge.
      - run: node scripts/isolation-check.mjs
      # Self-improving memory: a role learns durable facts and dedupes them.
      - run: npx tsx agent-runner/scripts/self-improve-check.mjs
      # Connectors: an agent operates a system; credential auto-pulled from Vault.
      - run: node scripts/connector-check.mjs
      # Knowledge/RAG: real docx/xlsx/pptx/pdf extraction → chunks → retrieval.
      - run: node scripts/rag-check.mjs
      # Nhập Agent từ persona markdown (The Agency) → Agent (soul/instructions).
      - run: node scripts/agent-import-check.mjs
      # Đăng nhập xong là có model để chat — không đòi smoke test phải xong trước.
      - run: node scripts/models-availability-check.mjs
      # Lỗi nhà cung cấp hiện ra câu người dùng hiểu, không phải JSON thô.
      - run: node scripts/provider-error-check.mjs
      # Các hợp đồng dưới đây trước đây chỉ chạy tay qua `npm run check`, nên
      # regression về AI Router / OAuth / Vault lọt lưới cho tới khi người dùng
      # báo lỗi. Chạy luôn trong CI.
      - run: node scripts/desktop-bundle-contract-check.mjs
      - run: node scripts/desktop-oauth-check.mjs
      - run: node scripts/pack-rebind-check.mjs
      - run: node scripts/host-process-contract-check.mjs
      - run: node scripts/ai-router-contract-check.mjs
      - run: node scripts/ai-router-multi-account-check.mjs
      - run: node scripts/credential-boundary-check.mjs
      - run: node scripts/connector-capability-check.mjs

  agent-runner:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: agent-runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      # Typecheck + end-to-end: inbound.db → poll loop → provider → outbound.db.
      - run: npm run check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev
      # tauri.conf.json bundles agent-runner/dist and runtime/node as resources.
      # Without them the Tauri build script aborts with "glob pattern … didn't
      # match any files", so `cargo check` failed on every push and the two Rust
      # contract tests below were skipped instead of run.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Stage Tauri resources
        shell: bash
        run: |
          npm ci
          npm ci --prefix agent-runner
          npm run build:runner
          archive="node-v24.18.0-linux-x64"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v24.18.0/${archive}.tar.gz" -o node.tar.gz
          tar -xzf node.tar.gz
          mkdir -p runtime/node
          install -m 755 "${archive}/bin/node" runtime/node/node
          test -d agent-runner/dist
          test -x runtime/node/node
      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
      - name: Loopback OAuth contract test
        working-directory: src-tauri
        run: cargo run --example oauth_loopback_check
      # Optional WASM code-sandbox (off by default for a light build).
      - name: WASM sandbox contract test
        working-directory: src-tauri
        run: cargo run --features sandbox --example sandbox_check
