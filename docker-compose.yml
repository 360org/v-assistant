# Test V Assistant locally:
#
#   docker compose up --build
#
# then open http://localhost:8080
#
# "Continue with OpenRouter" performs a real sign-in (localhost is a valid
# OAuth callback). Other vendors route through OpenRouter's models.
services:
  v-assistant:
    build: .
    image: v-assistant:latest
    ports:
      - "8080:80"
    restart: unless-stopped
