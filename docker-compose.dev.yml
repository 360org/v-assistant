# Live dev in Docker — nothing installed on the host (no Node, no Rust).
#
#   docker compose -f docker-compose.dev.yml up
#   → open http://localhost:1420
#
# Your source is bind-mounted into the container, so editing files on the host
# hot-reloads the app instantly. node_modules lives in a named volume inside
# the container (its platform binaries never touch the host). "Continue with
# OpenRouter" signs in for real (localhost is a valid callback).
#
# Stop with Ctrl-C; `docker compose -f docker-compose.dev.yml down` to remove.
services:
  dev:
    # Node 24 includes the read-only SQLite API used by the NanoClaw session
    # bridge. The UI never writes to NanoClaw's runtime volume.
    image: node:24-bookworm-slim
    working_dir: /app
    # Install deps on first run, then start Vite listening on all interfaces
    # so the host can reach it through the mapped port.
    command: sh -lc "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 1420"
    ports:
      - "1420:1420"
    environment:
      # Polling makes file-watching reliable across the host↔container mount
      # (notably on macOS and Windows Docker Desktop).
      CHOKIDAR_USEPOLLING: "true"
      # Used only by the Docker OAuth contract test. The browser runtime keeps
      # using its localhost AI Router URL.
      AI_ROUTER_BASE_URL: "http://ai-router:20128/v1"
    volumes:
      # Live-mount the project; edits on the host reload in the browser.
      - .:/app
      # Keep container-built node_modules out of the host mount.
      - node_modules:/app/node_modules
      - nanoclaw_appdata:/nanoclaw-appdata:ro
    depends_on:
      ai-router:
        condition: service_healthy
    restart: unless-stopped

  ai-router:
    image: node:24-bookworm-slim
    working_dir: /app
    command: node ai-router/src/sidecar.mjs
    ports:
      - "20128:20128"
      - "1455:1455"
      - "56121:56121"
    environment:
      AI_ROUTER_HOST: "0.0.0.0"
      AI_ROUTER_PORT: "20128"
      AI_ROUTER_UI_ORIGIN: "http://localhost:1420"
      AI_ROUTER_CALLBACK_HOST: "0.0.0.0"
      AI_ROUTER_VAULT_PATH: "/data/vault.json"
      AI_ROUTER_PACKS_PATH: "/data/packs.json"
    volumes:
      - .:/app:ro
      - ai_router_data:/data
      # The browser dev broker and AI Router must resolve the same App Vault.
      # Metadata carries credentialRef only; secrets never enter connection JSON.
      - ./.vua_vault_dev.json:/data/vault.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  node_modules:
  ai_router_data:
  nanoclaw_appdata:
    external: true
    name: nanoclaw_nanoclaw-appdata
