# Live dev in Docker — nothing installed on the host (no Node, no Rust).
#
#   docker compose -f docker-compose.dev.yml up
#   → open http://localhost:1420
#
# Your source is bind-mounted into the container, so editing files on the host
# hot-reloads the app instantly. node_modules lives in a named volume inside
# the container (its platform binaries never touch the host). "Continue with
# OpenRouter" signs in for real (localhost is a valid callback).
#
# Stop with Ctrl-C; `docker compose -f docker-compose.dev.yml down` to remove.
services:
  dev:
    image: node:20-bookworm-slim
    working_dir: /app
    # Install deps on first run, then start Vite listening on all interfaces
    # so the host can reach it through the mapped port.
    command: sh -lc "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 1420"
    ports:
      - "1420:1420"
    environment:
      # Polling makes file-watching reliable across the host↔container mount
      # (notably on macOS and Windows Docker Desktop).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Live-mount the project; edits on the host reload in the browser.
      - .:/app
      # Keep container-built node_modules out of the host mount.
      - node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  node_modules:
