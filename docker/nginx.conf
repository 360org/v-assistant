server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: OAuth returns to /?code=… — always serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
